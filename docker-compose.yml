version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ajolote_db
    environment:
      POSTGRES_USER: ajolote_user
      POSTGRES_PASSWORD: ajolote_pass
      POSTGRES_DB: ajolotedb
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_USER: ajolote_user
      DB_PASSWORD: ajolote_pass
      DB_NAME: ajolotedb
    depends_on:
      - postgres